<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kovix – csatorna-műszerfal</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#0f0f0f;--panel:#1a1a1a;--line:#2e2e2e;--tx:#f1f1f1;--mut:#9a9a9a;--acc:#ffd21f;--bad:#ff6b5e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0;font-weight:700}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--tx);background:#272727;border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
button:hover{background:#333}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc)}
button.p{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
main{padding:24px;max-width:1300px;margin:auto}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));border:1px solid var(--line);border-radius:16px;overflow:hidden}
.totals div{padding:18px 20px;border-right:1px solid var(--line)}
.totals b{display:block;font-size:30px;margin-top:4px}
.mut{color:var(--mut);font-size:13px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:20px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
svg{width:100%;height:auto;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px;margin-top:20px}
.ch h3{margin:0;font-size:17px;display:flex;align-items:center;gap:10px}
.ch img{width:36px;height:36px;border-radius:50%}
.live{font-size:34px;font-weight:700;margin:12px 0 0;color:var(--acc)}
.row{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line)}
.top{margin-top:10px;font-size:13px}.top div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top b{white-space:nowrap}.av{width:36px;height:36px;border-radius:50%;background:#333;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.totals [data-met]{cursor:pointer}.totals [data-met]:hover{background:#202020}.totals .on{background:#252525;box-shadow:inset 0 -3px 0 var(--acc)}
.ch{cursor:pointer}.ch:hover{background:#202020}.ch.on{outline:2px solid #fff}
.tip{position:absolute;display:none;background:#272727;border:1px solid #444;border-radius:10px;padding:8px 12px;font-size:13px;pointer-events:none;z-index:5;white-space:nowrap}
.vhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin:34px 0 14px}.vhead h2{margin:0;font-size:20px}
.vcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:20px;align-items:start}
.vbox{margin-top:0}.vbox h3{margin:0 0 8px;font-size:17px}
.vi{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}.vi:hover .vt b{text-decoration:underline}
.vi img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;flex:none;background:#262626}.vi.s img{width:62px;aspect-ratio:9/16}
.vt{display:flex;flex-direction:column;gap:4px;min-width:0}.vt b{font-size:14px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.lk{display:inline-block;margin-top:4px;font-size:13px;color:var(--acc)}
.vi{flex-direction:column;gap:6px}.vl{display:flex;gap:12px;color:inherit;text-decoration:none}
.vi .mv{align-self:flex-start;padding:3px 10px;font-size:12px}
input[type=date]{color-scheme:dark;padding:6px 12px}
.err{color:var(--bad);font-size:13px;margin-top:8px}
.setup{max-width:620px;margin:60px auto;text-align:center}
.setup input{width:100%;border-radius:12px;margin:14px 0;text-align:left}
</style>
</head>
<body>
<header>
  <h1>Kovix csatornák</h1>
  <div class="bar">
    <select id="range" aria-label="Időszak"><option value="7">Utolsó 7 nap</option><option value="28" selected>Utolsó 28 nap</option><option value="90">Utolsó 90 nap</option><option value="365">Utolsó 365 nap</option><option value="all">Összes idő</option><option value="custom">Egyéni időszak…</option></select>
    <input type="date" id="d1" aria-label="Kezdő dátum" hidden><input type="date" id="d2" aria-label="Záró dátum" hidden>
    <span class="mut" id="upd"></span>
    <button id="add" class="p">Csatorna csatlakoztatása</button>
    <button id="hid"></button>
    <button id="cfg">Client ID</button>
  </div>
</header>
<main id="app"></main>

<script>
const SCOPES='https://www.googleapis.com/auth/youtube.readonly https://www.googleapis.com/auth/yt-analytics.readonly https://www.googleapis.com/auth/yt-analytics-monetary.readonly';
const COLORS=['#ffd21f','#4cc9f0','#ff6b9d','#7ae582','#c77dff'];
const $=s=>document.querySelector(s);
const fmt=n=>n==null?'–':Math.abs(n)>=1e6?(n/1e6).toFixed(1).replace('.',',')+' M':Math.abs(n)>=1e4?(n/1e3).toFixed(1).replace('.',',')+' E':Math.round(n).toLocaleString('hu-HU');
const ft=n=>n==null?'–':hide?'$$$$$':Math.round(n).toLocaleString('hu-HU')+' Ft';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEFAULT_CID='914863107657-8mv2qbphi8k70v0rpovcb02nlmcfg7b7.apps.googleusercontent.com';
let cid=localStorage.getItem('kv_cid')||DEFAULT_CID;
let chans=JSON.parse(sessionStorage.getItem('kv_ch')||'[]');
let tc=null,sel=null,met='v',hide=false,vsort='p',gran='napi';const lim={v:12,s:12,l:12};
let ovr={};try{ovr=JSON.parse(localStorage.getItem('kv_ovr')||'{}')}catch(e){}
try{hide=localStorage.getItem('kv_hide')==='1'}catch(e){}
const MN={v:'Megtekintések',h:'Nézési idő (óra)',n:'Nettó új feliratkozó',r:'Becsült bevétel'};
const FM={v:fmt,h:fmt,n:x=>(x>0?'+':'')+fmt(x),r:x=>hide?'$$$':fmt(x)+' Ft'};

function save(){sessionStorage.setItem('kv_ch',JSON.stringify(chans.map(({daily,...r})=>({...r,daily}))))}
const iso=d=>d.toISOString().slice(0,10);
async function api(url,tok){
  const r=await fetch(url,{headers:{Authorization:'Bearer '+tok}});
  if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}
  return r.json();
}
async function load(c){
  c.err='';
  try{
    const me=await api('https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails&mine=true',c.token);
    const it=me.items[0];
    c.id=it.id;c.title=it.snippet.title;const th=it.snippet.thumbnails;c.thumb=(th.medium||th.default).url;c.subs=+it.statistics.subscriberCount;c.up=it.contentDetails.relatedPlaylists.uploads;
    c.pub=it.snippet.publishedAt;const RG=rng(c);gran=RG.month?'havi':'napi';
    const q=`startDate=${RG.s}&endDate=${RG.e}&ids=channel==MINE`;
    const A='https://youtubeanalytics.googleapis.com/v2/reports?'+q;
    const m='views,estimatedMinutesWatched,subscribersGained,subscribersLost';
    // A bevételt külön kérjük le: az késik a legjobban, és ha egy lekérdezésben van, megvághatja a többi adat legfrissebb napjait is.
    const rep=await api(A+`&metrics=${m}&dimensions=day&sort=day`,c.token);
    const rv={};
    try{
      const rr=await api(A+'&currency=HUF&metrics=estimatedRevenue&dimensions=day&sort=day',c.token);
      rr.rows.forEach(r=>rv[r[0]]=r[1]);c.hasRev=true;
    }catch(e){c.hasRev=false}
    c.daily=rep.rows.map(r=>({d:r[0],v:r[1],h:r[2]/60,n:r[3]-r[4],r:rv[r[0]]||0}));
    if(RG.month)c.daily=monthly(c.daily);
    c.views=sum(rep.rows,1);c.hours=sum(rep.rows,2)/60;c.net=sum(rep.rows,3)-sum(rep.rows,4);c.rev=c.hasRev?Object.values(rv).reduce((a,x)=>a+x,0):null;
    try{
      const t=await api(A+'&metrics=views&dimensions=video&sort=-views&maxResults=3',c.token);
      const ids=t.rows.map(r=>r[0]).join(',');
      const v=ids?await api('https://www.googleapis.com/youtube/v3/videos?part=snippet&id='+ids,c.token):{items:[]};
      const nm={};v.items.forEach(x=>nm[x.id]=x.snippet.title);
      c.top=t.rows.map(r=>({t:nm[r[0]]||r[0],v:r[1]}));
    }catch(e){c.top=[]}
  }catch(e){c.err=e.status===401?'A munkamenet lejárt – csatlakoztasd újra.':'Nem sikerült betölteni ('+e.message+').'}
}
const sum=(rows,i)=>rows.reduce((a,r)=>a+(r[i]||0),0);

async function refresh(){
  await Promise.all(chans.map(load));save();render();
  $('#upd').textContent='Frissítve: '+new Date().toLocaleTimeString('hu-HU');
  await Promise.all(chans.filter(c=>!c.vids&&!c.err).map(c=>loadVids(c)));save();render();
}
async function liveSubs(){ // csak a feliratkozószám, percenként
  await Promise.all(chans.map(async c=>{try{
    const r=await api('https://www.googleapis.com/youtube/v3/channels?part=statistics&mine=true',c.token);
    c.subs=+r.items[0].statistics.subscriberCount}catch(e){}}));
  document.querySelectorAll('[data-live]').forEach(el=>{const c=chans[+el.dataset.live];if(c)el.textContent=c.subs.toLocaleString('hu-HU')});
  const t=$('#tsubs');if(t)t.textContent=(sel!=null&&chans[sel]?[chans[sel]]:chans).reduce((a,c)=>a+(c.subs||0),0).toLocaleString('hu-HU');
}

const dur=x=>{const m=/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(x||'')||[];return (+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0)};
async function loadVids(c,more){
  if(!c.up)return;
  try{
    c.verr='';
    if(!more||!c.vids){c.vids=[];c.vnext=''}
    let tok=more?c.vnext:'';
    for(let k=0;k<3;k++){
      const pl=await api('https://www.googleapis.com/youtube/v3/playlistItems?part=contentDetails&maxResults=50&playlistId='+c.up+(tok?'&pageToken='+tok:''),c.token);
      const ids=pl.items.map(x=>x.contentDetails.videoId).join(',');
      if(ids){
        const vs=await api('https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics,contentDetails,liveStreamingDetails,status&id='+ids,c.token);
        vs.items.forEach(v=>{
          if(v.status&&v.status.privacyStatus==='private')return;
          const d=dur(v.contentDetails.duration);
          c.vids.push({id:v.id,t:v.snippet.title,p:v.snippet.publishedAt,v:+(v.statistics.viewCount||0),d,k:v.liveStreamingDetails?'l':d<=180?'s':'v'});
        });
      }
      tok=pl.nextPageToken||'';c.vnext=tok;
      if(!tok)break;
    }
  }catch(e){c.verr='A videók betöltése nem sikerült ('+e.message+').'}
}
const mmss=x=>x>=3600?Math.floor(x/3600)+':'+String(Math.floor(x%3600/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0'):Math.floor(x/60)+':'+String(x%60).padStart(2,'0');
const mvBtn=(x,k)=>{
  let to,t;
  if(k===x.ok){if(x.ok==='v')return '';to='v';t=x.ok==='l'?'Ez premier → Videók':'Ez sima videó → Videók'}
  else{to=x.ok;t=x.ok==='l'?'Mégis élő adás':'Mégis short'}
  return `<button class="mv" data-mv="${x.id}" data-to="${to}" data-ok="${x.ok}">${t}</button>`;
};
function vidsHtml(){
  const scope=sel!=null&&chans[sel]?[chans[sel]]:chans;
  const all=scope.flatMap(c=>(c.vids||[]).map(v=>({...v,ok:v.k,k:ovr[v.id]||v.k,ch:c.title,col:COLORS[chans.indexOf(c)%5]})));
  const errs=scope.filter(c=>c.verr).map(c=>`<div class="err">${esc(c.title)}: ${esc(c.verr)}</div>`).join('');
  if(!all.length)return `<div class="box"><div class="mut">${scope.some(c=>!c.vids)?'Videók betöltése…':'Nincs megjeleníthető videó.'}</div>${errs}</div>`;
  const cmp=vsort==='v'?(a,b)=>b.v-a.v:(a,b)=>b.p.localeCompare(a.p);
  const cols=[['v','Videók'],['s','Shortok'],['l','Élő adások']].map(([k,name])=>{
    const L=all.filter(x=>x.k===k).sort(cmp),shown=L.slice(0,lim[k]);
    return `<div class="box vbox"><h3>${name} <span class="mut">(${L.length})</span></h3>${shown.map((x,i)=>`
      <div class="vi ${k==='s'?'s':''}"><a class="vl" href="https://www.youtube.com/${k==='s'?'shorts/':'watch?v='}${x.id}" target="_blank" rel="noopener">
        <img src="https://i.ytimg.com/vi/${x.id}/mqdefault.jpg" referrerpolicy="no-referrer" loading="lazy" alt="">
        <span class="vt"><b>${vsort==='v'?(i+1)+'. ':''}${esc(x.t)}</b>
        <span class="mut">${scope.length>1?`<i class="dot" style="background:${x.col}"></i>${esc(x.ch)} · `:''}${x.p.slice(0,10)} · ${fmt(x.v)} megtekintés${k==='l'?'':' · '+mmss(x.d)}</span></span>
      </a>${mvBtn(x,k)}</div>`).join('')||'<div class="mut">Nincs ilyen tartalom.</div>'}
      ${L.length>lim[k]?`<button data-more="${k}" style="margin-top:10px">Továbbiak (${L.length-lim[k]})</button>`:''}</div>`;
  }).join('');
  const older=scope.some(c=>c.vnext);
  return `<div class="vhead"><h2>Videók</h2><div class="bar">
    <select id="vsort" aria-label="Rendezés"><option value="p"${vsort==='p'?' selected':''}>Legfrissebb elöl</option><option value="v"${vsort==='v'?' selected':''}>Legnézettebb elöl</option></select>
    ${older?'<button id="vold">Régebbi videók betöltése</button>':''}<button id="vref">Videók frissítése</button></div></div>${errs}<div class="vcols">${cols}</div>`;
}
function rng(c){
  const v=$('#range').value,today=iso(new Date()),d1=$('#d1').value,d2=$('#d2').value;
  let s0,e0=today;
  if(v==='custom'&&d1&&d2&&d1<=d2){s0=d1;e0=d2>today?today:d2}
  else if(v==='all')s0=(c.pub||'2005-04-01').slice(0,10);
  else s0=iso(new Date(Date.now()-((+v)||28)*864e5));
  return {s:s0,e:e0,month:(new Date(e0)-new Date(s0))/864e5>400};
}
function monthly(rows){
  const m={};
  rows.forEach(x=>{const k=x.d.slice(0,7),t=m[k]||(m[k]={d:k,v:0,h:0,n:0,r:0});t.v+=x.v;t.h+=x.h;t.n+=x.n;t.r+=x.r});
  return Object.keys(m).sort().map(k=>m[k]);
}
function rl(){
  const v=$('#range').value;
  if(v==='all')return 'összes idő';
  if(v==='custom'&&$('#d1').value&&$('#d2').value)return $('#d1').value+' – '+$('#d2').value;
  return (v==='custom'?28:v)+' nap';
}
function totalDaily(){
  const m={};
  chans.forEach(c=>(c.daily||[]).forEach(x=>{const t=m[x.d]||(m[x.d]={d:x.d,v:0,h:0,n:0,r:0});t.v+=x.v;t.h+=x.h;t.n+=x.n;t.r+=x.r}));
  return Object.keys(m).sort().map(d=>m[d]);
}
function lc(data,color,W,H,big,key){
  key=key||'v';
  if(!data.length)return '<div class="mut">Nincs adat.</div>';
  const L=key==='r'?(W>600?92:70):54,R=10,T=10,B=24,n=data.length,f=FM[key];
  const vals=data.map(x=>x[key]||0);
  let mn=Math.min(0,...vals),mx=Math.max(...vals);
  if(mx<=mn)mx=mn+1;
  if(big)window.__sc={mn,mx,L};
  const X=i=>L+i*(W-L-R)/Math.max(1,n-1),Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  let s=`<svg ${big?'id="big" ':''}viewBox="0 0 ${W} ${H}" role="img" aria-label="${MN[key]}">`;
  for(let g=0;g<=3;g++){const v=mn+(mx-mn)*g/3,y=Y(v);
    s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#2e2e2e"/><text x="${L-8}" y="${y+4}" fill="#9a9a9a" font-size="11" text-anchor="end">${f(v)}</text>`}
  const pts=vals.map((v,i)=>X(i)+','+Y(v)).join(' ');
  s+=`<polygon points="${X(0)},${Y(0)} ${pts} ${X(n-1)},${Y(0)}" fill="${color}" opacity=".12"/>`;
  s+=`<polyline fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" points="${pts}"/>`;
  s+=`<text x="${L}" y="${H-6}" fill="#9a9a9a" font-size="11">${data[0].d}</text><text x="${W-R}" y="${H-6}" fill="#9a9a9a" font-size="11" text-anchor="end">${data[n-1].d}</text>`;
  if(big)s+=`<line id="hl" y1="${T}" y2="${H-B}" stroke="#888" stroke-dasharray="4" style="display:none;pointer-events:none"/><circle id="hc" r="5" fill="${color}" stroke="#111" stroke-width="2" style="display:none;pointer-events:none"/>`;
  return s+'</svg>';
}
function bigChart(){
  const c=sel!=null?chans[sel]:null;
  const d=c?(c.daily||[]):totalDaily();
  window.__bd=d;
  return lc(d,c?COLORS[sel%5]:'#ffffff',900,260,true,met);
}
function render(){
  $('#hid').textContent=hide?'Bevétel megjelenítése':'Bevétel elrejtése';
  const app=$('#app');
  if(!cid){
    app.innerHTML=`<div class="setup"><h2>Első lépés: Google OAuth Client ID</h2><p class="mut">Hozz létre egy „Web application” típusú OAuth Client ID-t a Google Cloud Console-ban, add hozzá ennek az oldalnak a címét az „Authorized JavaScript origins” listához, majd illeszd be ide.</p><input id="cidin" placeholder="123456-abc.apps.googleusercontent.com"><button class="p" id="cidsave">Mentés</button></div>`;
    $('#cidsave').onclick=()=>{cid=$('#cidin').value.trim();localStorage.setItem('kv_cid',cid);render()};
    return;
  }
  if(!chans.length){
    app.innerHTML=`<div class="setup"><h2>Csatlakoztasd a csatornáidat</h2><p class="mut">Kattints a „Csatorna csatlakoztatása” gombra, és a Google ablakban válaszd ki az adott csatornát (Kovix, Kovix extra, Kovixd, Kovblox). Ismételd meg mindegyikkel.</p></div>`;
    return;
  }
  const scope=sel!=null&&chans[sel]?[chans[sel]]:chans;
  const ok=scope.filter(c=>c.views!=null);
  const T=k=>ok.reduce((a,c)=>a+(c[k]||0),0);
  const days=$('#range').value;
  app.innerHTML=`
  <div class="totals">
    <div data-met="v" class="${met==='v'?'on':''}"><span class="mut">Megtekintések (${rl()})</span><b>${fmt(T('views'))}</b></div>
    <div data-met="h" class="${met==='h'?'on':''}"><span class="mut">Nézési idő (óra)</span><b>${fmt(T('hours'))}</b></div>
    <div data-met="n" class="${met==='n'?'on':''}"><span class="mut">Feliratkozók, nettó változás</span><b>${(T('net')>=0?'+':'')+fmt(T('net'))}</b></div>
    <div><span class="mut">${sel!=null?'Feliratkozó (kerekített)':'Összes feliratkozó (kerekített)'}</span><b id="tsubs">${scope.reduce((a,c)=>a+(c.subs||0),0).toLocaleString('hu-HU')}</b></div>
    <div data-met="r" class="${met==='r'?'on':''}"><span class="mut">Becsült bevétel</span><b>${ok.some(c=>c.hasRev)?ft(T('rev')):'–'}</b></div>
  </div>
  <div class="box" style="position:relative"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div class="mut">${sel!=null&&chans[sel]?esc(chans[sel].title)+' – '+MN[met]+', '+gran+' bontás':'Összes csatorna – '+MN[met]+', '+gran+' bontás'} (vidd az egeret a grafikon fölé)</div>${sel!=null?'<button id="all">Összes csatorna</button>':''}</div><div id="tip" class="tip"></div>${bigChart()}</div>
  <div class="grid">${chans.map((c,i)=>`
    <div class="box ch${sel===i?' on':''}" data-sel="${i}" tabindex="0" style="margin-top:0;border-top:3px solid ${COLORS[i%5]}">
      <h3><img src="${esc(c.thumb||'')}" referrerpolicy="no-referrer" alt="" data-i="${esc((c.title||'?')[0])}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'av',textContent:this.dataset.i}))">${esc(c.title||'Betöltés…')}</h3>
      <div class="live" data-live="${i}">${(c.subs||0).toLocaleString('hu-HU')}</div><div class="mut">feliratkozó (kerekített, percenként frissül)</div><a class="lk" href="https://studio.youtube.com/channel/${c.id}/analytics/tab-overview/period-default" target="_blank" rel="noopener" onclick="event.stopPropagation()">Pontos érték a Studióban</a>
      <div style="margin-top:12px">
        <div class="row"><span class="mut">Megtekintések</span><b>${fmt(c.views)}</b></div>
        <div class="row"><span class="mut">Nézési idő (óra)</span><b>${fmt(c.hours)}</b></div>
        <div class="row"><span class="mut">Nettó új feliratkozó</span><b>${c.net>0?'+':''}${fmt(c.net)}</b></div>
        <div class="row"><span class="mut">Becsült bevétel</span><b>${c.hasRev?ft(c.rev):'–'}</b></div>
      </div>
      <div class="mut" style="margin-top:14px">${MN[met]}, ${gran} bontás</div>${lc(c.daily||[],COLORS[i%5],420,170,false,met)}
      <div class="top">${(c.top||[]).map(t=>`<div><span>${esc(t.t)}</span><b>${fmt(t.v)}</b></div>`).join('')}</div>
      ${c.err?`<div class="err">${esc(c.err)}</div>`:''}
      <button style="margin-top:12px" data-rm="${i}">Eltávolítás</button>
    </div>`).join('')}</div>
  ${vidsHtml()}
  <p class="mut">A napi adatok a YouTube Analytics API-ból érkeznek, általában 1–3 nap késéssel. A bevétel forintban látszik, a YouTube árfolyamával átváltva.</p>`;
  app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=e=>{e.stopPropagation();chans.splice(+b.dataset.rm,1);sel=null;save();render()});
  app.querySelectorAll('.ch').forEach(el=>{const go=()=>{sel=sel===+el.dataset.sel?null:+el.dataset.sel;render();window.scrollTo({top:0,behavior:'smooth'})};el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter')go()}});
  app.querySelectorAll('[data-met]').forEach(el=>el.onclick=()=>{met=el.dataset.met;render()});
  const keep=()=>{const y=scrollY;render();scrollTo(0,y)};
  app.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{
    if(b.dataset.to===b.dataset.ok)delete ovr[b.dataset.mv];else ovr[b.dataset.mv]=b.dataset.to;
    try{localStorage.setItem('kv_ovr',JSON.stringify(ovr))}catch(e){}
    keep();
  });
  const vs=$('#vsort');if(vs)vs.onchange=()=>{vsort=vs.value;keep()};
  app.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{lim[b.dataset.more]+=12;keep()});
  const vo=$('#vold');if(vo)vo.onclick=async()=>{vo.textContent='Betöltés…';await Promise.all(scope.filter(c=>c.vnext).map(c=>loadVids(c,true)));save();keep()};
  const vr=$('#vref');if(vr)vr.onclick=async()=>{vr.textContent='Frissítés…';await Promise.all(scope.map(c=>loadVids(c)));save();keep()};
  const al=$('#all');if(al)al.onclick=()=>{sel=null;render()};
  const svg=$('#big');
  if(svg){
    const d=window.__bd,k=met,{mn,mx,L}=window.__sc,W=900,R=10,H=260,T=10,B=24;
    const hl=svg.querySelector('#hl'),hc=svg.querySelector('#hc'),tip=$('#tip');
    svg.onmousemove=e=>{
      const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width;
      let i=Math.round((x-L)/(W-L-R)*(d.length-1));i=Math.max(0,Math.min(d.length-1,i));
      const px=L+i*(W-L-R)/Math.max(1,d.length-1),py=T+(1-(d[i][k]-mn)/(mx-mn))*(H-T-B),y=d[i];
      hl.setAttribute('x1',px);hl.setAttribute('x2',px);hc.setAttribute('cx',px);hc.setAttribute('cy',py);
      hl.style.display=hc.style.display='';
      tip.innerHTML=`<b>${y.d}</b><br>${Math.round(y.v).toLocaleString('hu-HU')} megtekintés<br>${fmt(y.h)} nézési óra<br>${(y.n>0?'+':'')+y.n} feliratkozó`+(ok.some(c=>c.hasRev)?`<br>${ft(y.r)}`:'');
      tip.style.display='block';
      const sx=px/W*r.width+20;let left=sx+14;if(left+tip.offsetWidth>r.width+20)left=sx-tip.offsetWidth-14;
      tip.style.left=left+'px';tip.style.top='50px';
    };
    svg.onmouseleave=()=>{tip.style.display='none';hl.style.display=hc.style.display='none'};
  }
}

function connect(){
  if(!cid){render();return}
  if(!window.google){alert('A Google bejelentkezés még töltődik, próbáld újra.');return}
  tc=google.accounts.oauth2.initTokenClient({client_id:cid,scope:SCOPES,prompt:'select_account',
    callback:async r=>{
      if(r.error){alert('Hiba: '+r.error);return}
      const c={token:r.access_token};
      await load(c);
      if(c.id){const i=chans.findIndex(x=>x.id===c.id);i>=0?chans[i]=c:chans.push(c);save();render();loadVids(c).then(()=>{save();render()})}
      else alert(c.err||'Nem található csatorna.');
    }});
  tc.requestAccessToken();
}
$('#add').onclick=connect;
$('#hid').onclick=()=>{hide=!hide;try{localStorage.setItem('kv_hide',hide?'1':'0')}catch(e){}render()};
$('#cfg').onclick=()=>{cid='';localStorage.removeItem('kv_cid');render()};
$('#range').onchange=()=>{
  const c=$('#range').value==='custom';
  $('#d1').hidden=$('#d2').hidden=!c;
  if(c&&!$('#d1').value){$('#d2').value=iso(new Date());$('#d1').value=iso(new Date(Date.now()-28*864e5))}
  refresh();
};
$('#d1').onchange=$('#d2').onchange=refresh;
render();
if(chans.length)refresh();
setInterval(()=>chans.length&&liveSubs(),60000);
setInterval(()=>chans.length&&refresh(),300000);
</script>
</body>
</html>
